<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0414">
<meta name="description" content="Tiny toys, puzzles and games in one neon arcade cabinet.">
<meta name="apple-mobile-web-app-title" content="Gltch Arcade">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Gltch Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0414'/%3E%3Ccircle cx='8' cy='9' r='5' fill='%23ff2bd6'/%3E%3Cpath d='M2 10.5h12M2 12.5h12' stroke='%230a0414'/%3E%3C/svg%3E">
<script>
/* Motion and static off? A saved choice wins, otherwise follow the system's reduce-motion setting. Runs before first paint so nothing flashes. */
(function () {
  var v = null; try { v = localStorage.getItem('gltch-arcade:calm'); } catch (e) { /* storage unavailable */ }
  if (v === '1' || (v === null && matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.classList.add('calm');
})();
</script>
<style>
:root{
  --night:#0a0414; --ink:#efe9ff; --dim:#a597cc;
  --pink:#ff2bd6; --cyan:#22e4ff; --yellow:#ffd319; --green:#3dff7a; --violet:#6b2bd9; --red:#ff4d6d;
  --accent:var(--cyan);
  --ui:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --term:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
html{height:100%;scroll-padding-bottom:120px}
body{margin:0;min-height:100%;background:var(--night);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.45;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed #fff;outline-offset:3px}

/* ---------- backdrop: sun, grid floor, fuzz, scanlines ---------- */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#05020c 0%,#1a0838 46%,#3a0f5c 60%,var(--night) 60.1%)}
.sun{position:absolute;left:50%;top:60%;width:min(64vw,440px);aspect-ratio:1;transform:translate(-50%,-64%);filter:drop-shadow(0 0 40px rgba(255,43,214,.55))}
.sun i{display:block;width:100%;height:100%;border-radius:50%;background:linear-gradient(180deg,var(--yellow) 8%,#ff7a3d 45%,var(--pink) 78%);
  -webkit-mask:linear-gradient(#000 0 50%,transparent 50%),repeating-linear-gradient(180deg,#000 0 13px,transparent 13px 21px);
  mask:linear-gradient(#000 0 50%,transparent 50%),repeating-linear-gradient(180deg,#000 0 13px,transparent 13px 21px)}
.floor{position:absolute;left:0;right:0;top:60%;bottom:0;perspective:300px;perspective-origin:50% 0;background:var(--night);overflow:hidden}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--pink);box-shadow:0 0 18px 4px var(--pink);z-index:1}
.grid{position:absolute;left:-100%;width:300%;top:0;height:250px;transform-origin:50% 0;transform:rotateX(70deg);
  background-image:linear-gradient(90deg,rgba(255,43,214,.75) 2px,transparent 2px),linear-gradient(0deg,rgba(255,43,214,.75) 2px,transparent 2px);
  background-size:40px 40px;animation:grid 1.6s linear infinite;
  -webkit-mask:linear-gradient(transparent,#000 30%);mask:linear-gradient(transparent,#000 30%)}
@keyframes grid{to{background-position:0 40px}}
#fuzz{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none;opacity:.05;mix-blend-mode:screen;image-rendering:pixelated}
.scan{position:fixed;inset:0;z-index:41;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ---------- cabinet ---------- */
.cab{position:relative;z-index:2;width:min(760px,100% - 20px);margin:14px auto 0;flex:1}
.marquee{display:flex;align-items:center;gap:14px;padding:6px 2px 16px}
.logo{flex:1;margin:0;line-height:0;min-width:0}
.logo svg{width:100%;max-width:540px;height:auto;overflow:visible;filter:drop-shadow(0 0 3px rgba(255,43,214,.9)) drop-shadow(0 0 14px rgba(255,43,214,.45))}
.logo .lt{animation:boot .5s both}
.logo .ghost{mix-blend-mode:screen;animation:gin .6s 1.2s both,ghost 7s 2s infinite steps(1)}
@keyframes boot{0%{opacity:0}35%{opacity:1}55%{opacity:.3}100%{opacity:1}}
@keyframes gin{from{opacity:0}to{opacity:.6}}
@keyframes ghost{0%,91%,100%{transform:translate(0,0)}92%{transform:translate(-.9px,.25px)}94%{transform:translate(.8px,-.2px)}96%{transform:translate(-.3px,0)}}

.btn{--c:var(--accent);display:inline-block;font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);background-color:rgba(5,2,10,.55);border:2px solid var(--c);border-radius:10px;padding:10px 16px;cursor:pointer;text-shadow:0 0 8px var(--c);
  box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 22%,transparent);transition:transform .12s,box-shadow .2s,background-color .2s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:hover{background-color:color-mix(in srgb,var(--c) 14%,rgba(5,2,10,.55));box-shadow:0 0 18px var(--c),inset 0 0 14px color-mix(in srgb,var(--c) 40%,transparent)}
.btn:active{transform:translateY(2px) scale(.97)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none;transform:none}
.btn.big{font-size:18px;padding:12px 24px}
.btn.on{background-color:var(--c);color:var(--night);text-shadow:none}
.btn.good{--c:var(--green)}
.btn.bad{--c:var(--red)}
.btn.good:disabled{opacity:1;box-shadow:0 0 16px var(--c)}
.snd{--c:var(--yellow);font-size:12px;padding:8px 12px;white-space:nowrap}
.snd.fx{--c:var(--cyan)}
.snd.go{--c:var(--green)}
/* Sound and FX swap their labels; an invisible copy of the longer one keeps each button the same width either way */
#snd::after,#fx::after{display:block;height:0;overflow:hidden;visibility:hidden}
#snd::after{content:"Sound off"}
#fx::after{content:"FX off"}
@media (max-width:560px){.marquee{flex-wrap:wrap;gap:10px 8px}.logo{flex:1 0 100%}.marquee .snd{flex:1 1 0;padding:8px 6px}}

.screen{--accent:var(--pink);position:relative;border-radius:26px;padding:12px clamp(12px,3.2vw,26px) 26px;min-height:560px;overflow:hidden;
  background:radial-gradient(130% 100% at 50% 0%,rgba(36,16,74,.84) 0%,rgba(18,6,42,.88) 55%,rgba(8,3,15,.94) 100%);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border:2px solid var(--accent);
  box-shadow:0 0 0 5px #05020a,0 0 0 7px color-mix(in srgb,var(--accent) 35%,transparent),0 0 34px color-mix(in srgb,var(--accent) 55%,transparent),inset 0 0 70px rgba(0,0,0,.85);
  transition:border-color .5s,box-shadow .5s}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(180deg,transparent 45%,rgba(255,255,255,.035) 50%,transparent 55%);background-size:100% 300%;animation:roll 9s linear infinite}
@keyframes roll{from{background-position:0 100%}to{background-position:0 -200%}}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--dim);padding:2px 2px 10px;margin-bottom:14px;border-bottom:1px solid color-mix(in srgb,var(--accent) 25%,transparent);font-variant-numeric:tabular-nums}
.hud .cat{color:var(--accent);text-shadow:0 0 8px var(--accent)}
.hud .done{color:var(--yellow);text-shadow:0 0 8px var(--yellow)}
#stage{position:relative}

.cab>.screen{margin-bottom:16px}
.foot{position:relative;z-index:2;font-size:13px;color:var(--dim);padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));text-align:center}
.foot .btn{--c:var(--cyan);display:block;margin:12px auto 0}

/* ---------- shared item parts ---------- */
.item{display:flex;flex-direction:column;align-items:center;text-align:center}
.chrome{transform:skewX(-9deg)}
.chrome span{background:linear-gradient(180deg,#fff 0%,#d9f4ff 38%,#7a3cf0 49%,var(--pink) 54%,var(--yellow) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.title{margin:4px 0 0;font-size:clamp(28px,7vw,46px);line-height:1.05;font-weight:800;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 70%,transparent))}
.blurb{margin:8px 0 16px;color:var(--dim);max-width:46ch}
.body{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.msg{font-size:clamp(22px,5.4vw,30px);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 12px var(--accent);min-height:1.3em}
.sub{margin:0;color:var(--dim);min-height:1.4em;max-width:46ch}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.stats span{display:flex;flex-direction:column;align-items:center;min-width:76px;padding:6px 10px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:8px;background:rgba(0,0,0,.25)}
.stats small{font-size:12px;color:var(--dim)}
.stats b{font-size:20px;color:var(--accent);text-shadow:0 0 8px var(--accent);font-variant-numeric:tabular-nums}
.field{font:inherit;color:var(--ink);background:rgba(0,0,0,.45);border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);border-radius:8px;padding:10px 12px;width:min(100%,380px);text-align:center}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 50%,transparent)}
textarea.field{text-align:left;resize:vertical;min-height:84px}
.sprite{display:block;filter:drop-shadow(0 0 4px currentColor)}
.bar{width:min(300px,78vw);height:8px;border-radius:4px;border:1px solid var(--accent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);box-shadow:0 0 10px var(--accent);transform-origin:left}

/* attract */
.attract{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0 4px}
.att-big{margin:0;font-size:clamp(36px,9.5vw,64px);font-weight:900;line-height:1;filter:drop-shadow(0 0 12px rgba(255,43,214,.7))}
.parade{display:flex;gap:18px;justify-content:center;padding:6px 0}
.parade .sprite{width:34px;height:34px}
.bob{animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}

/* oracle */
.oct{position:relative;width:min(240px,66vw);aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 0 8px var(--yellow)) drop-shadow(0 0 24px rgba(255,211,25,.35))}
.oct svg{width:100%;height:100%;display:block}
.oct-a{position:absolute;inset:23%;display:grid;place-items:center;font-weight:800;font-size:clamp(15px,4vw,19px);line-height:1.15;letter-spacing:.05em;color:var(--cyan);text-shadow:0 0 10px var(--cyan);pointer-events:none;transition:opacity .2s}

/* coin */
.coin-stage{position:relative;height:250px;width:220px;display:flex;align-items:flex-end;justify-content:center;perspective:900px;cursor:pointer}
.coin{position:absolute;bottom:40px;width:150px;height:150px;transform-style:preserve-3d}
.coin .face{--fc:var(--yellow);position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:62px;font-weight:900;color:var(--fc);border:5px solid var(--fc);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-shadow:0 0 14px var(--fc);
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.35) 0 7%,transparent 26%),repeating-conic-gradient(rgba(255,255,255,.06) 0 6deg,transparent 6deg 12deg),radial-gradient(circle,#2b0f52 0 58%,#160634 59% 100%);
  box-shadow:0 0 22px var(--fc),inset 0 0 0 10px rgba(0,0,0,.35),inset 0 0 26px color-mix(in srgb,var(--fc) 45%,transparent)}
.coin .back{--fc:var(--cyan);transform:rotateY(180deg)}
.coin-shadow{width:110px;height:16px;border-radius:50%;background:radial-gradient(rgba(255,211,25,.45),transparent 70%);margin-bottom:8px}

/* dice */
.die-wrap{height:190px;display:grid;place-items:center;filter:drop-shadow(0 0 10px rgba(255,211,25,.8)) drop-shadow(0 0 26px rgba(255,43,214,.4))}
.die{width:160px;height:160px;display:grid;place-items:center;background:linear-gradient(150deg,var(--yellow),#ff7a3d 55%,var(--pink));clip-path:var(--shape)}
.die b{font-size:58px;font-weight:900;color:#1a0633;transform:translateY(var(--dy,0));font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:30px}
.chips span{padding:2px 9px;border-radius:6px;border:1px solid rgba(255,211,25,.35);color:var(--dim);font-variant-numeric:tabular-nums}
.btn.sm{font-size:13px;padding:7px 11px}

/* cookie */
.cookie{position:relative;width:240px;height:150px;border:0;background:none;padding:0;cursor:pointer}
.half{position:absolute;top:22px;width:118px;height:104px;background:radial-gradient(circle at 50% 30%,#ffe2a1,#eaa94e 50%,#b36a22 100%);box-shadow:0 0 18px rgba(255,211,25,.45),inset 0 -10px 18px rgba(90,40,0,.45);transition:transform .7s cubic-bezier(.2,1.5,.4,1)}
.half.l{left:4px;border-radius:100px 18px 30px 100px / 96px 30px 40px 96px;transform-origin:100% 60%}
.half.r{right:4px;border-radius:18px 100px 100px 30px / 30px 96px 96px 40px;transform-origin:0 60%}
.cookie.open .half.l{transform:translate(-42px,8px) rotate(-30deg)}
.cookie.open .half.r{transform:translate(42px,8px) rotate(30deg)}
.slip{position:absolute;left:50%;top:50%;z-index:2;width:min(320px,80vw);padding:12px 14px;background:#fff7e6;color:#2a0d4a;font-size:15px;line-height:1.35;border-radius:3px;box-shadow:0 0 22px rgba(255,211,25,.55);pointer-events:none;
  transform:translate(-50%,-50%) scaleX(0);opacity:0;transition:transform .55s .2s cubic-bezier(.2,1.2,.3,1),opacity .2s .2s}
.cookie.open .slip{transform:translate(-50%,-50%) scaleX(1);opacity:1}
.slip small{display:block;margin-top:6px;color:#8a4a9e;font-size:12px;letter-spacing:.1em}
.crumb{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:#eaa94e;border-radius:2px;pointer-events:none}

/* wheel */
.wheel-box{position:relative;width:min(300px,76vw);aspect-ratio:1}
.wheel-box canvas{width:100%;height:100%;display:block}
.wheel-box::after{content:"";position:absolute;left:50%;top:-8px;transform:translateX(-50%);border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--yellow);filter:drop-shadow(0 0 6px var(--yellow))}

/* flip card */
.flip{width:min(100%,480px);height:220px;perspective:1100px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.25,.5,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;display:grid;place-items:center;padding:18px 22px;border-radius:16px;border:2px solid var(--accent);background:linear-gradient(160deg,#1d0b3e,#0d0420);backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(16px,4vw,19px);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.fc.b{transform:rotateY(180deg);font-size:clamp(20px,5vw,26px);font-weight:800;color:var(--accent);text-shadow:0 0 12px var(--accent)}

/* sequence */
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.seq span{min-width:50px;padding:10px 8px;border-radius:10px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);font-size:clamp(18px,5vw,24px);font-weight:800;background:rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.seq .q{border:2px dashed var(--accent);color:var(--accent);text-shadow:0 0 10px var(--accent)}
.seq .q.good{border-style:solid;border-color:var(--green);color:var(--green);text-shadow:0 0 10px var(--green)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,340px)}

/* echo */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(270px,70vw)}
.pad{aspect-ratio:1;border-radius:18px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#0d0420);cursor:pointer;padding:0;transition:background-color .1s,box-shadow .1s,transform .1s}
.pad.lit{background:var(--c);box-shadow:0 0 28px var(--c),0 0 60px color-mix(in srgb,var(--c) 50%,transparent);transform:scale(.96)}
.pads.busy .pad{cursor:wait}

/* reflex */
.react{--a:var(--cyan);width:min(100%,480px);height:230px;border-radius:18px;border:2px solid var(--a);background:rgba(0,0,0,.35);font-weight:900;font-size:clamp(22px,6vw,32px);letter-spacing:.06em;color:var(--a);text-shadow:0 0 12px var(--a);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background-color .25s,border-color .25s,color .25s}
.react small{font-size:15px;letter-spacing:.14em;opacity:.85}
.react[data-s=wait]{--a:var(--pink);background:rgba(255,43,214,.12)}
.react[data-s=go]{--a:var(--green);background:var(--green);color:var(--night);text-shadow:none;transition:none}
.react[data-s=early]{--a:var(--yellow)}

.illusion{width:min(100%,480px);height:auto;border-radius:10px;border:2px solid var(--accent);display:block}

/* rpsls */
.vs{display:flex;align-items:center;justify-content:center;gap:clamp(12px,5vw,28px)}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--dim);font-size:13px;font-weight:700;letter-spacing:.18em}
.hand{--c:var(--accent);width:clamp(92px,26vw,120px);aspect-ratio:1;border-radius:18px;border:2px solid var(--c);display:grid;place-items:center;background:rgba(0,0,0,.35);color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent);transition:border-color .2s,box-shadow .2s,color .2s}
.hand .sprite{width:58%;height:58%}
.hand.won{--c:var(--green)}
.hand.lost{--c:#6f5f99}
.vs-x{font-size:22px;color:var(--yellow);text-shadow:0 0 10px var(--yellow)}
.choice{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:76px;padding:9px 8px;font-size:11px}
.choice .sprite{width:28px;height:28px;color:var(--c)}
.rules{color:var(--dim);font-size:14px;width:min(100%,420px)}
.rules summary{cursor:pointer;color:var(--accent);font-weight:700;letter-spacing:.12em}
.rules ul{margin:10px 0 0;padding:0;list-style:none;columns:2;column-gap:18px;text-align:left}

/* tic-tac-toe */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(270px,70vw)}
.cell{aspect-ratio:1;border-radius:12px;border:2px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);cursor:pointer;padding:0;display:grid;place-items:center;transition:border-color .2s,box-shadow .2s}
.cell:not(:disabled):hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.cell:disabled{cursor:default}
.cell svg{width:72%;height:72%;overflow:visible}
.cell svg *{fill:none;stroke-width:12;stroke-linecap:round;stroke-dasharray:1 2;stroke-dashoffset:1;animation:draw .28s ease-out forwards}
.cell svg line+line{animation-delay:.14s}
.cell .x{stroke:var(--pink);filter:drop-shadow(0 0 6px var(--pink))}
.cell .o{stroke:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
.cell.win{border-color:var(--yellow);box-shadow:0 0 18px var(--yellow),inset 0 0 14px rgba(255,211,25,.3)}
@keyframes draw{to{stroke-dashoffset:0}}

/* cards */
.cards{display:flex;gap:18px;justify-content:center;align-items:center;perspective:900px}
.card{--c:var(--cyan);position:relative;width:clamp(104px,28vw,124px);aspect-ratio:5/7;border-radius:12px;border:2px solid var(--c);background:linear-gradient(160deg,#1d0b3e,#0d0420);color:var(--c);display:grid;place-items:center;box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent);text-shadow:0 0 10px var(--c);transition:border-color .25s,box-shadow .25s}
.card .s{font-size:clamp(48px,13vw,62px);line-height:1}
.card .r{position:absolute;font-weight:800;font-size:18px;line-height:1}
.card .tl{top:8px;left:9px}
.card .br{bottom:8px;right:9px;transform:rotate(180deg)}
.card.back{--c:var(--violet);background:repeating-linear-gradient(45deg,rgba(255,43,214,.25) 0 6px,transparent 6px 14px),linear-gradient(160deg,#1d0b3e,#0d0420)}
.card.good{border-color:var(--green);box-shadow:0 0 24px var(--green)}
.card.bad{border-color:var(--red);box-shadow:0 0 24px var(--red)}

/* whacker */
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(300px,78vw)}
.hole{position:relative;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,43,214,.35);background:radial-gradient(ellipse at 50% 75%,#000 0 42%,#1a0838 60%,#0d0420 100%);overflow:hidden;cursor:crosshair;padding:0;touch-action:manipulation}
.mob{position:absolute;inset:16%;transform:translateY(130%);transition:transform .14s ease-out}
.mob .sprite{width:100%;height:100%}
.hole.up .mob{transform:translateY(0)}
.hole.hit .mob{transform:translateY(10%) scale(1.25,.55);transition-duration:.08s}
.float{position:absolute;left:50%;top:22%;font-weight:900;font-size:22px;pointer-events:none}

/* snake */
.snake{width:min(100%,400px);aspect-ratio:1;border-radius:12px;border:2px solid var(--green);box-shadow:0 0 18px rgba(61,255,122,.35);touch-action:none;display:block}
.dpad{display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px);gap:6px}
.dpad .btn{padding:0;font-size:20px}
.dpad .u{grid-column:2}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
@media (pointer:coarse){.dpad{display:grid}}

/* bubble wrap */
.bw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:min(330px,84vw);touch-action:none;user-select:none;-webkit-user-select:none}
.bub{aspect-ratio:1;border-radius:50%;cursor:pointer;border:1px solid rgba(61,255,122,.55);
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,.25) 7% 20%,transparent 21%),radial-gradient(circle,rgba(61,255,122,.08) 0 52%,rgba(61,255,122,.35) 75%,rgba(61,255,122,.6) 100%);
  box-shadow:0 0 8px rgba(61,255,122,.35),inset 0 -4px 8px rgba(0,0,0,.4);transition:opacity .3s,box-shadow .3s}
.bub.popped{opacity:.3;box-shadow:none;transform:scale(.84);background:radial-gradient(circle,transparent 0 38%,rgba(61,255,122,.35) 40% 46%,transparent 48% 62%,rgba(61,255,122,.25) 64% 70%,transparent 72%)}

/* warp */
.warp{width:100%;max-width:640px;aspect-ratio:2/1;border-radius:12px;border:2px solid var(--accent);display:block;background:#05020c;touch-action:none}
.gauge{font-weight:800;font-size:22px;letter-spacing:.14em;color:var(--accent);text-shadow:0 0 10px var(--accent);font-variant-numeric:tabular-nums}
.hold{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* facts */
.fact{width:min(100%,500px);min-height:170px;padding:18px 20px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);background:rgba(0,10,4,.5);font-family:var(--term);font-size:16px;line-height:1.55;text-align:left;color:var(--green);text-shadow:0 0 6px rgba(61,255,122,.6)}
.fact::before{content:"> ";opacity:.6}
.caret{animation:blink 1s steps(1) infinite}

/* band */
.sign{min-height:2.6em;width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 .32em;font-size:clamp(28px,7.5vw,48px);font-weight:900;line-height:1.1;color:#fff;text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 28px var(--pink),0 0 48px rgba(255,43,214,.6);transform:skewX(-8deg)}
.sign .w{display:inline-flex}
.sign .w span{display:inline-block}
.album{margin:0;color:var(--cyan);text-shadow:0 0 8px var(--cyan);font-size:18px}

/* excuse */
.excuse{width:min(100%,460px);min-height:120px;padding:18px 20px;border-radius:16px 16px 16px 4px;background:rgba(61,255,122,.07);border:2px solid var(--accent);font-size:clamp(18px,4.6vw,22px);line-height:1.4;display:grid;place-items:center;box-shadow:0 0 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.meter{display:flex;flex-direction:column;align-items:center;gap:6px}
.meter .bar i{transition:transform .9s cubic-bezier(.2,1,.3,1)}

/* octagon flip */
.of-play{display:flex;flex-wrap:wrap;gap:22px 34px;justify-content:center;align-items:center}
.of-stage{width:230px;height:240px;display:grid;place-items:center;perspective:900px}
.of-coin{position:relative;width:200px;height:200px;transform-style:preserve-3d}
.of-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.of-face svg{width:100%;height:100%;display:block;overflow:visible}
.of-face.a svg{filter:drop-shadow(0 0 8px rgba(255,43,214,.8))}
.of-face.b{transform:rotateY(180deg)}
.of-face.b svg{filter:drop-shadow(0 0 8px rgba(34,228,255,.8))}
.compass{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px}
.compass .btn{padding:0;display:grid;place-items:center}
.compass .btn svg{width:26px;height:26px;fill:currentColor}
.compass .hub{display:grid;place-items:center;font-size:12px;line-height:1.15;color:var(--dim)}
.of-round{margin:0;font-size:18px}
.of-round b{color:var(--accent);text-shadow:0 0 8px var(--accent)}
.btn.bad:disabled{opacity:1;box-shadow:0 0 16px var(--c)}
.rules p{margin:8px 0 0;text-align:left}

/* cards: blackjack, hold'em, card psychic */
.table{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:520px;padding:12px 8px;border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);background:radial-gradient(ellipse at 50% 40%,rgba(255,43,214,.07),transparent 70%)}
.hand-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:84px;perspective:600px}
.hand-lbl{font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;min-height:1.2em}
.pc{--c:var(--cyan);flex:none;width:56px;height:80px;border-radius:8px;border:2px solid var(--c);background:linear-gradient(160deg,#1d0b3e,#0d0420);color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;line-height:1;text-shadow:0 0 8px var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 40%,transparent)}
.pc .r{font-size:20px}
.pc .s{font-size:22px}
.pc.back{--c:var(--violet);background:repeating-linear-gradient(45deg,rgba(255,43,214,.25) 0 5px,transparent 5px 11px),linear-gradient(160deg,#1d0b3e,#0d0420)}
.pc.slot{--c:rgba(255,255,255,.18);background:none;box-shadow:none;border-style:dashed}
.pc.hi{border-color:var(--yellow);box-shadow:0 0 18px var(--yellow)}
.pc.big{width:110px;height:154px}
.pc.big .r{font-size:40px}
.pc.big .s{font-size:44px}
.cols21{display:flex;gap:14px;justify-content:center}
.col21{font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;padding:8px 6px;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(0,0,0,.25);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.col21:not(:disabled):hover{border-color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.col21:disabled{cursor:default}
.col21 .pc{width:50px;height:66px;flex-direction:row;align-items:flex-start;justify-content:flex-start;padding:4px 5px;gap:1px}
.col21 .pc .r,.col21 .pc .s{font-size:15px}
.col21 .pc+.pc{margin-top:-40px}
/* jokes */
.joke{width:min(100%,480px);min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:18px 20px;border-radius:16px;border:2px solid var(--accent);background:rgba(0,0,0,.3)}
.joke .q{font-size:clamp(19px,4.6vw,23px)}
.joke .a{font-size:clamp(21px,5vw,26px);font-weight:800;color:var(--accent);text-shadow:0 0 10px var(--accent);min-height:1.3em}
/* password gauntlet */
.pw-warn{margin:0;font-size:14px;color:var(--yellow)}
.field.pw{font-family:var(--term);font-size:17px;width:min(100%,460px);text-align:left}
.rules-list{list-style:none;margin:0;padding:0;width:min(100%,460px);display:flex;flex-direction:column;gap:8px;text-align:left}
.rules-list li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--red);background:rgba(255,77,109,.08)}
.rules-list li.ok{border-color:var(--green);background:rgba(61,255,122,.07)}
.rules-list li b{flex:none;font-size:12px;letter-spacing:.1em;padding:2px 6px;border-radius:4px;background:var(--red);color:var(--night)}
.rules-list li.ok b{background:var(--green)}
/* canvases */
.grid-ill{width:min(100%,480px);height:auto;display:block;border-radius:10px;border:2px solid var(--accent)}
.race{width:100%;max-width:640px;aspect-ratio:16/9;border-radius:12px;border:2px solid var(--accent);display:block;touch-action:none;background:#05020c}
.maze{width:min(100%,408px);height:auto;aspect-ratio:17/14;border-radius:12px;border:2px solid var(--accent);display:block;touch-action:none}
.shoot{width:min(100%,400px);aspect-ratio:5/6;border-radius:12px;border:2px solid var(--accent);display:block;touch-action:none;background:#05020c}

/* jump menu */
.menu-btn{--c:var(--pink)}
#jump{padding:0;border:2px solid var(--pink);border-radius:18px;background:rgba(12,4,28,.97);color:var(--ink);width:min(700px,94vw);max-height:88vh;box-shadow:0 0 40px rgba(255,43,214,.45);font-family:var(--ui)}
#jump::backdrop{background:rgba(5,2,12,.72);backdrop-filter:blur(4px)}
#jump[open]{animation:jin .25s ease-out}
@keyframes jin{from{opacity:0;transform:translateY(16px) scale(.97)}}
.jump-in{padding:16px 18px 22px;overflow:auto;max-height:88vh}
.jump-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.jump-head h2{margin:0;font-size:22px;letter-spacing:.08em;color:#fff;text-shadow:0 0 10px var(--pink)}
.jump-in>.sub{margin:4px 0 0;max-width:none}
.jump-sec{margin-top:16px}
.jump-sec h3{margin:0 0 8px;font-size:13px;letter-spacing:.2em;color:var(--accent);text-shadow:0 0 8px var(--accent)}
.jump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.jump-a{display:block;position:relative;padding:9px 10px;border-radius:9px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);color:var(--ink);text-decoration:none;font-size:15px;line-height:1.25;background:rgba(0,0,0,.3);transition:background-color .15s,box-shadow .15s}
.jump-a:hover,.jump-a:focus-visible{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 50%,transparent)}
.jump-a.seen{color:var(--dim)}
.jump-a.seen::before{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.jump-a.cur{border:2px solid var(--accent);color:#fff;font-weight:700}
/* batch 3 */
input[type=range]{accent-color:var(--accent);width:min(100%,260px)}
select.field{text-align:left;cursor:pointer;background-color:#12052a}
.tempo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.life{touch-action:none;cursor:crosshair}
.cc-slots{display:flex;gap:8px}
.cc-slots span{width:48px;height:58px;border-radius:10px;border:2px solid color-mix(in srgb,var(--accent) 45%,transparent);display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--accent);text-shadow:0 0 8px var(--accent);background:rgba(0,0,0,.3);transition:border-color .2s,box-shadow .2s}
.cc-slots span.on{border-color:var(--accent);box-shadow:0 0 12px var(--accent)}
.cc-play{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start;width:100%}
.cc-pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.cc-pad .btn{padding:10px 0;font-size:18px}
.cc-pad .btn.w{font-size:14px;letter-spacing:.04em}
.cc-hist{display:flex;flex-direction:column;gap:6px;width:min(100%,260px);max-height:300px;overflow:auto}
.cc-hist:empty{display:none}   /* no guesses yet: let the keypad sit in the middle */
.cc-row{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.3)}
.cc-row b{color:var(--dim);font-size:12px;width:1.6em}
.cc-g{font-family:var(--term);font-size:20px;letter-spacing:.1em;flex:1;text-align:left}
.pegs{display:flex;gap:4px}
.pegs i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.25)}
.pegs i.g{background:var(--green);border-color:var(--green);box-shadow:0 0 6px var(--green)}
.pegs i.y{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.df-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:min(100%,360px)}
.df-cell{aspect-ratio:1;border-radius:6px;border:1px solid rgba(34,228,255,.4);background:rgba(34,228,255,.1);font:inherit;font-weight:800;font-size:18px;color:var(--ink);padding:0;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background-color .15s}
.df-cell:hover{background:rgba(34,228,255,.2)}
.df-cell.open{background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.06);cursor:default}
.df-cell[data-n="1"]{color:var(--cyan)}.df-cell[data-n="2"]{color:var(--green)}.df-cell[data-n="3"]{color:var(--yellow)}.df-cell[data-n="4"]{color:var(--pink)}.df-cell[data-n="5"],.df-cell[data-n="6"],.df-cell[data-n="7"],.df-cell[data-n="8"]{color:var(--red)}
.df-cell .sprite{width:62%;height:62%}
.df-cell.flag{color:var(--yellow);border-color:var(--yellow)}
.df-cell.boom{color:var(--red);border-color:var(--red)}
.df-cell.hit{background:rgba(255,77,109,.45)}
.bb-wrap{width:100%;overflow-x:auto}
.bb-grid{display:grid;grid-template-columns:44px repeat(16,minmax(16px,1fr));gap:3px;min-width:330px;max-width:640px;margin:0 auto;align-items:center}
.bb-lbl{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--c);text-align:left}
.bb-cell{aspect-ratio:1;min-width:0;padding:0;border-radius:4px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:rgba(255,255,255,.03);cursor:pointer;transition:background-color .1s,box-shadow .1s}
.bb-cell.beat{background:rgba(255,255,255,.08)}
.bb-cell.on{background:var(--c);box-shadow:0 0 10px var(--c)}
.bb-cell.ph{border-color:#fff;box-shadow:inset 0 0 0 1px #fff}
.bb-cell.on.ph{box-shadow:0 0 16px var(--c),inset 0 0 0 2px #fff}
.mb-target{width:min(100%,460px);min-height:56px;padding:14px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);background:rgba(0,10,4,.5);font-family:var(--term);font-size:clamp(17px,4.4vw,22px);color:var(--dim);text-align:left;white-space:pre-wrap}
.mb-target .ok{color:var(--green);text-shadow:0 0 6px rgba(61,255,122,.7)}
.mb-target .bad{color:var(--night);background:var(--red)}
.field.err{border-color:var(--red);box-shadow:0 0 12px rgba(255,77,109,.5)}
.trace{display:flex;align-items:center;gap:10px;width:min(100%,460px)}
.trace .bar{flex:1;width:auto;height:12px;border-color:var(--red)}
.trace .bar i{background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));box-shadow:none}
.mail{width:min(100%,500px);display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:rgba(0,0,0,.35);text-align:left}
.mail-row{display:flex;gap:8px;font-size:14px;flex-wrap:wrap}
.mail-row b{color:var(--dim);font-weight:700;min-width:7.5em}
.mail-row span{word-break:break-all}
.mail-subj{font-size:18px;font-weight:800;color:#fff;margin-top:6px}
.mail-body{margin:2px 0 6px;font-size:16px}
.mail-flags{width:min(100%,500px);margin:0;padding-left:22px;text-align:left}
.mail-flags li{margin:5px 0}
.mail-flags .mail-h{list-style:none;margin-left:-22px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-size:13px}
.lamp{--glow:#ff2bd6;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--glow) 55%,transparent))}
.lamp .cap{width:90px;height:34px;background:linear-gradient(90deg,#2a1d40,#9a8ac0 45%,#2a1d40);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}
.lamp .glass{width:min(56vw,190px);aspect-ratio:72/128;clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);overflow:hidden;background:#12052a}
.lamp .glass canvas{width:100%;height:100%;display:block;filter:blur(1.2px) saturate(1.2)}
.lamp .base{width:min(56vw,190px);height:70px;background:linear-gradient(90deg,#2a1d40,#9a8ac0 45%,#2a1d40);clip-path:polygon(0 0,100% 0,80% 100%,20% 100%)}

/* batch 4 */
.aim{cursor:crosshair}
.d4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:min(100%,400px);padding:10px;border-radius:16px;border:2px solid var(--accent);background:rgba(0,0,0,.35);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.d4-col{display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:none;cursor:pointer;border-radius:10px;touch-action:manipulation}
.d4-col:hover .d4-cell{border-color:color-mix(in srgb,var(--accent) 70%,transparent)}
.d4-cell{aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.12);background:#07020f;display:grid;place-items:center}
.d4-disc{width:84%;height:84%;border-radius:50%;display:block}
.d4-disc.x{background:radial-gradient(circle at 35% 30%,#ffb3ef,var(--pink) 60%);box-shadow:0 0 12px var(--pink)}
.d4-disc.o{background:radial-gradient(circle at 35% 30%,#b8f6ff,var(--cyan) 60%);box-shadow:0 0 12px var(--cyan)}
.d4-cell.win{border-color:var(--yellow);box-shadow:0 0 14px var(--yellow)}
.bo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(100%,320px)}
.bo-cell{aspect-ratio:1;border-radius:10px;border:2px solid rgba(255,211,25,.3);background:rgba(255,211,25,.05);cursor:pointer;padding:0;transition:background-color .15s,box-shadow .15s,border-color .15s}
.bo-cell.on{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 18px var(--yellow),inset 0 0 10px rgba(255,255,255,.6)}
.sl-box{position:relative;width:min(80vw,300px);aspect-ratio:1;border-radius:14px;border:2px solid var(--accent);background:rgba(0,0,0,.4);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent);overflow:hidden}
.sl-tile{position:absolute;left:0;top:0;width:25%;height:25%;z-index:0;padding:0;border:0;background:none;cursor:pointer;font:inherit;font-size:clamp(20px,6vw,28px);font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);transition:transform .14s cubic-bezier(.3,.9,.4,1)}
.sl-tile::before{content:"";position:absolute;inset:3px;z-index:-1;border-radius:10px;background:linear-gradient(150deg,hsl(var(--hue) 100% 62% / .9),hsl(calc(var(--hue) + 40) 100% 42% / .9));box-shadow:0 0 10px hsl(var(--hue) 100% 60% / .5)}
.sl-tile.ok::before{outline:2px solid rgba(255,255,255,.7);outline-offset:-4px}
.wh-word{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:48px}
.wh-word span{width:clamp(24px,6.5vw,34px);height:44px;border-bottom:3px solid var(--accent);display:grid;place-items:end center;padding-bottom:4px;font-size:clamp(20px,5.5vw,28px);font-weight:900;color:#fff}
.wh-word span.on{color:var(--green);text-shadow:0 0 10px var(--green)}
.wh-word span.miss{color:var(--red)}
.wh-alarm{display:flex;gap:8px}
.wh-alarm i{width:26px;height:12px;border-radius:3px;border:1px solid var(--red);background:rgba(255,77,109,.08)}
.wh-alarm i.on{background:var(--red);box-shadow:0 0 12px var(--red)}
.wh-keys{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;width:min(100%,420px)}
.wh-keys .btn{padding:8px 0}
.orb-wrap{position:relative;width:min(100%,420px);aspect-ratio:1}
.orb{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;display:block}
.orb:not(.top){box-shadow:0 0 0 2px var(--accent),0 0 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.orb.top{pointer-events:none}
.mo-out{display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:center;width:min(100%,520px);min-height:56px}
.mo-word{display:flex;gap:10px}
.mo-letter{display:flex;flex-direction:column;align-items:center;gap:4px}
.mo-letter b{font-size:13px;color:var(--dim)}
.mo-syms{display:flex;gap:4px;align-items:center;min-height:10px}
.mo-syms i{display:block;height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 35%,transparent)}
.mo-syms i.dot{width:8px}
.mo-syms i.dash{width:24px}
.mo-syms i.lit{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.mo-lamp{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:rgba(0,0,0,.4)}
.mo-lamp.lit{background:var(--accent);box-shadow:0 0 18px var(--accent)}
.mo-big{font-family:var(--term);font-size:24px;letter-spacing:.15em;color:var(--accent);min-height:1.4em;text-shadow:0 0 8px var(--accent)}

/* batch 5 */
.fw{width:100%;max-width:640px;aspect-ratio:8/5;border-radius:12px;border:2px solid var(--accent);display:block;touch-action:none;cursor:crosshair;background:#05020c}
.pixpad{width:min(100%,384px);aspect-ratio:1;height:auto;border-radius:8px;border:2px solid var(--accent);display:block;touch-action:none;cursor:crosshair;image-rendering:pixelated}
.pal{display:grid;grid-template-columns:repeat(8,32px);gap:6px}
.sw{width:32px;height:32px;border-radius:7px;border:2px solid rgba(255,255,255,.2);background:var(--sw);cursor:pointer;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent),0 0 12px var(--sw)}
.cf-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(100%,320px)}
.cf-cell{aspect-ratio:1;border-radius:12px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 70%,#0a0414);box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent);cursor:pointer;padding:0;transition:background-color .2s,border-color .2s,box-shadow .2s}
.tq{font-size:clamp(18px,4.6vw,22px);font-weight:700;max-width:30em;min-height:2.6em}
.tq-opts{width:min(100%,480px)}
.tq-opts .btn{text-transform:none;letter-spacing:.02em;font-size:15px;line-height:1.25}
@media (max-width:520px){.tq-opts{grid-template-columns:1fr}}

/* batch 6 */
.pin{width:min(100%,310px);aspect-ratio:3/5;height:auto;border-radius:12px;border:2px solid var(--accent);display:block;touch-action:none;background:#05020c}
.pair{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,340px)}
.pu{--c:var(--accent);aspect-ratio:1;display:grid;place-items:center;padding:12%;border-radius:12px;border:2px solid color-mix(in srgb,var(--accent) 55%,transparent);background:rgba(0,0,0,.35);color:var(--c);cursor:pointer;font:800 26px var(--ui);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 30%,transparent);transition:background-color .2s,border-color .2s,box-shadow .2s,opacity .3s;touch-action:manipulation}
.pu .sprite{width:100%;height:100%}
.pu.up{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,rgba(0,0,0,.4));box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}
.pu.done{opacity:.5}
.pu:disabled{cursor:default}
.kal{width:min(100%,420px);aspect-ratio:1;height:auto;border-radius:50%;border:2px solid var(--accent);display:block;touch-action:none;cursor:crosshair;background:#05020c;box-shadow:0 0 22px color-mix(in srgb,var(--accent) 45%,transparent)}

/* batch 7: tickets and the prize counter */
.tk{display:inline-block;width:22px;height:13px;background:currentColor;filter:drop-shadow(0 0 4px currentColor);
  -webkit-mask:radial-gradient(circle at 0 50%,#0000 3px,#000 3.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,#0000 3px,#000 3.5px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 50%,#0000 3px,#000 3.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,#0000 3px,#000 3.5px) right/51% 100% no-repeat}
.hud .tix{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--yellow);text-shadow:0 0 8px var(--yellow);background:none;border:1px solid transparent;border-radius:8px;padding:1px 8px;cursor:pointer;font-variant-numeric:tabular-nums;touch-action:manipulation}
.hud .tix:hover,.hud .tix:focus-visible{background:rgba(255,211,25,.1);border-color:rgba(255,211,25,.4)}
.hud .tix b{font-weight:700}
.tix-plus{position:absolute;left:50%;top:100%;margin-top:2px;font-size:13px;font-weight:800;color:var(--yellow);text-shadow:0 0 8px var(--yellow);pointer-events:none;white-space:nowrap}
.jump-head{flex-wrap:wrap}
.jump-head .row{flex-wrap:nowrap;gap:8px}
.btn.cash-b{--c:var(--yellow)}
#cash{padding:0;border:2px solid var(--yellow);border-radius:18px;background:rgba(12,4,28,.97);color:var(--ink);width:min(520px,94vw);max-height:90vh;box-shadow:0 0 40px rgba(255,211,25,.4);font-family:var(--ui);overflow:hidden}
#cash::backdrop{background:rgba(5,2,12,.78);backdrop-filter:blur(4px)}
#cash[open]{animation:jin .25s ease-out}
.cash-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 18px 22px;text-align:center;min-height:400px;overflow:hidden}
.cash-in>*:not(.cash-tk):not(.cash-star){position:relative;z-index:1}
.cash-t{margin:0;font-size:clamp(28px,8vw,40px);line-height:1.05;font-weight:800;filter:drop-shadow(0 0 10px rgba(255,211,25,.6))}
.cash-slot{width:min(70%,260px);height:12px;border-radius:6px;background:#05020a;border:2px solid var(--yellow);box-shadow:0 0 14px rgba(255,211,25,.6),inset 0 0 8px #000}
.cash-n{font-size:clamp(56px,17vw,92px);font-weight:900;line-height:1;color:var(--yellow);text-shadow:0 0 18px var(--yellow);font-variant-numeric:tabular-nums}
.cash-u{margin:-6px 0 0;font-size:13px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.cash-tk{position:absolute;left:50%;top:44px;width:36px;height:19px;z-index:0;background:linear-gradient(90deg,var(--yellow),#ff7a3d);opacity:.9;pointer-events:none;
  -webkit-mask:radial-gradient(circle at 0 50%,#0000 4px,#000 4.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,#0000 4px,#000 4.5px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 50%,#0000 4px,#000 4.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,#0000 4px,#000 4.5px) right/51% 100% no-repeat}
.cash-hs{font-weight:900;font-size:clamp(16px,4.6vw,22px);letter-spacing:.22em;color:var(--green);text-shadow:0 0 12px var(--green);animation:blink .6s steps(1) infinite}
.cash-win{font-weight:900;font-size:clamp(40px,12vw,64px);letter-spacing:.1em;line-height:1;color:var(--pink);text-shadow:0 0 18px currentColor;animation:rb 1.4s linear infinite}
@keyframes rb{0%,100%{color:#ff2bd6}25%{color:#22e4ff}50%{color:#3dff7a}75%{color:#ffd319}}
.cash-got{color:var(--dim);font-size:15px;letter-spacing:.08em}
.cash-tier{display:inline-block;padding:3px 12px;border-radius:99px;border:1px solid var(--yellow);color:var(--yellow);font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;text-shadow:0 0 8px var(--yellow)}
.cash-prize{margin:2px 0 6px;font-size:clamp(26px,7.4vw,40px);line-height:1.12;font-weight:900}
.cash-star{position:absolute;left:50%;top:46%;width:16px;height:16px;z-index:0;pointer-events:none}
.cash-star .sprite{width:100%;height:100%}

/* batch 7: number crunch, nine letters */
.cn-target{font-size:clamp(46px,14vw,76px);font-weight:900;line-height:1;color:var(--yellow);text-shadow:0 0 18px var(--yellow);font-variant-numeric:tabular-nums}
.cn-play{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.cn-tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.cn-t{min-width:58px;height:56px;padding:0 10px;border-radius:10px;border:2px solid color-mix(in srgb,var(--accent) 70%,transparent);background:rgba(0,0,0,.35);color:#fff;font:800 24px var(--ui);font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation;transition:border-color .15s,box-shadow .15s,background-color .15s}
.cn-t.made{border-color:var(--pink)}
.cn-t.sel{border-color:var(--yellow);background:rgba(255,211,25,.15);box-shadow:0 0 14px var(--yellow)}
.cn-t.used{opacity:.28}
.cn-t:disabled{cursor:default}
.cn-ops{display:flex;gap:8px}
.cn-ops .btn{width:56px;padding:8px 0;font-size:22px;text-shadow:none}
.cn-log{margin:0;padding:0;list-style:none;font-family:var(--term);font-size:16px;color:var(--dim);display:flex;flex-direction:column;gap:2px;min-height:1.5em}
.cn-sol{width:min(100%,360px);color:var(--dim)}
.cn-sol summary{cursor:pointer;color:var(--accent);font-weight:700;letter-spacing:.12em}
.cn-sol .cn-log{margin-top:8px;align-items:center}
.nl-in{font-family:var(--term);font-size:22px;letter-spacing:.2em;text-transform:uppercase}
.nl-best{margin:0;color:var(--dim);min-height:1.4em}
.nl-words{color:var(--green);text-shadow:0 0 8px rgba(61,255,122,.6);font-weight:700;letter-spacing:.12em}

/* batch 7: sudoku */
.su{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,396px);border:3px solid var(--accent);border-radius:8px;overflow:hidden;background:rgba(0,0,0,.4);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.su-c{position:relative;aspect-ratio:1;display:grid;place-items:center;padding:0;border:0;border-right:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);border-radius:0;background:none;color:var(--cyan);font:700 clamp(18px,5.6vw,26px) var(--ui);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.su-c.cr{border-right:2px solid var(--accent)}
.su-c.cb{border-bottom:2px solid var(--accent)}
.su-c.ce{border-right:0}
.su-c.ct{border-bottom:0}
.su-c.gv{color:#fff;font-weight:800}
.su-c.pe{background:rgba(34,228,255,.08)}
.su-c.sm{background:rgba(34,228,255,.22)}
.su-c.sl{background:rgba(255,211,25,.22);box-shadow:inset 0 0 0 2px var(--yellow)}
.su-c.er{color:var(--red);background:rgba(255,77,109,.18)}
.su-n{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(7px,2vw,10px);font-weight:700;line-height:1;color:var(--dim);pointer-events:none}
.su-n i{font-style:normal;display:grid;place-items:center}
.su-pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,396px)}
.su-pad .btn{padding:9px 0;font-size:18px;text-shadow:none}
.su-pad .btn.w{font-size:12px;letter-spacing:.06em}
.su-pad .btn:disabled{opacity:.25}

/* batch 7: neon cube */
.cube{width:min(100%,420px);aspect-ratio:1;height:auto;border-radius:16px;border:2px solid var(--accent);display:block;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 40%,#2a1060,#080312 75%);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.cube:active{cursor:grabbing}
.cube-pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:min(100%,420px)}
.cube-pad .btn{padding:8px 0;font-size:16px;text-shadow:none}
.bf{width:min(100%,360px);aspect-ratio:360/420;height:auto;border-radius:12px;border:2px solid var(--accent);background:#07020f;display:block;touch-action:none;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.bf-pad{display:none;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,360px)}
.bf-pad .btn{padding:13px 0;font-size:18px;text-shadow:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bf-pad .btn.w{font-size:13px;letter-spacing:.06em}
@media (pointer:coarse){.bf-pad{display:grid}}
.du-b{position:relative;width:min(100%,400px);aspect-ratio:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);border-radius:14px;border:2px solid var(--accent);background:rgba(0,0,0,.4);touch-action:none;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.du-c{padding:5px}
.du-c::before{content:"";display:block;width:100%;height:100%;border-radius:8px;background:rgba(255,255,255,.05)}
.du-t{position:absolute;left:0;top:0;width:25%;height:25%;padding:5px;transform:translate(calc(var(--x)*100%),calc(var(--y)*100%));transition:transform .12s ease-out;pointer-events:none}
.du-t b{display:grid;place-items:center;width:100%;height:100%;border-radius:8px;border:2px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,#0b0418);font-weight:900;font-size:clamp(20px,6.5vw,32px);text-shadow:0 0 10px var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent)}
.du-t[data-d="3"] b{font-size:clamp(17px,5.4vw,27px)}
.du-t[data-d="4"] b{font-size:clamp(14px,4.4vw,22px)}
.calm .du-t{transition-duration:.01s}
.wp [hidden]{display:none!important}
.wp{width:min(100%,660px);display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;border:2px solid var(--green);background:radial-gradient(ellipse at 50% 30%,rgba(10,46,20,.85),rgba(2,10,5,.97));box-shadow:0 0 22px rgba(61,255,122,.3),inset 0 0 40px rgba(0,0,0,.6);font-family:var(--term);color:var(--green);text-shadow:0 0 6px rgba(61,255,122,.55);text-align:left}
.wp-map{display:flex;flex-direction:column;gap:6px}
.wp-cv{width:100%;aspect-ratio:640/326;height:auto;display:block;border:1px solid rgba(61,255,122,.5);border-radius:6px;background:#020a05}
.wp-hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 14px;font-size:12px;letter-spacing:.08em}
.wp-def{display:flex;align-items:center;gap:4px}
.wp-def small{margin-right:4px;font-size:12px}
.wp-def i{display:grid;place-items:center;width:22px;height:22px;border:1px solid currentColor;border-radius:4px;opacity:.28;font-style:normal;text-shadow:none}
.wp-def i b{font-size:13px;font-weight:700}
.wp-def i.on{opacity:1;background:currentColor}
.wp-def i.on b{color:#020a05}
.wp-st{color:var(--yellow)}
.wp-mt{display:grid;grid-template-columns:8.5em 1fr 3.4em;align-items:center;gap:8px;font-size:12px;text-shadow:none}
.wp-mt em{font-style:normal;text-align:right}
.wp-bar{display:block;height:10px;border:1px solid currentColor;border-radius:3px;overflow:hidden}
.wp-bar b{display:block;height:100%;width:0;background:currentColor;transition:width .3s}
.calm .wp-bar b{transition-duration:.01s}
.wp-tg{font-size:12px;color:var(--yellow);min-height:1.4em}
.wp-log{min-height:150px;max-height:230px;overflow-y:auto;font-size:15px;line-height:1.5;overscroll-behavior:contain}
.wp-l{min-height:1.5em;white-space:pre-wrap;overflow-wrap:anywhere}
.wp-l.dim{opacity:.6}
.wp-l.me{color:#d6ffe2;text-shadow:none}
.wp-l.hot{color:var(--red);text-shadow:0 0 8px var(--red)}
.wp-opts{display:flex;flex-wrap:wrap;gap:6px}
.wp-opt{font:inherit;font-size:14px;color:var(--green);background:rgba(2,10,5,.7);border:1px solid rgba(61,255,122,.55);border-radius:6px;padding:7px 10px;cursor:pointer;text-align:left;text-shadow:inherit;white-space:pre-wrap;touch-action:manipulation}
.wp-opt:hover,.wp-opt:focus-visible{background:rgba(61,255,122,.16);outline:none}
.wp-opts>.wp-opt:not(.chip):not(.act){flex:1 1 100%}
.wp-opt.gap{margin-top:8px}
.wp-opt.chip.on{background:var(--green);color:#020a05;text-shadow:none}
.wp-opt.act{font-weight:700;letter-spacing:.1em;border-color:var(--red);color:var(--red)}
.wp-opt.act:last-child{border-color:var(--green);color:var(--green)}
.wp-break{flex-basis:100%;height:0}
.wp-row{display:flex;align-items:center;gap:8px}
.wp-in{flex:1;min-width:0;font:inherit;font-size:16px;color:#d6ffe2;background:transparent;border:0;border-bottom:1px solid rgba(61,255,122,.5);padding:6px 2px;text-transform:uppercase;outline:none;caret-color:var(--green)}

/* FX off (or the system asks for reduced motion): no animation, no static */
/* batch 9: Road Hop, Sky Guard, Colour Clash, Flood Fill, Tarot Draw, Mind Reader, Sand Drop, Pendulum Wave */
.rh{width:min(100%,396px);aspect-ratio:11/12;height:auto;border-radius:12px;border:2px solid var(--green);display:block;touch-action:none;background:#05020c;box-shadow:0 0 18px rgba(61,255,122,.3)}
.sg{width:min(100%,420px);aspect-ratio:10/11;height:auto;border-radius:12px;border:2px solid var(--cyan);display:block;touch-action:none;cursor:crosshair;background:#05020c;box-shadow:0 0 18px rgba(34,228,255,.3)}
.cl-bar{width:min(300px,78vw);height:8px;border-radius:4px;border:1px solid var(--accent);overflow:hidden}
.cl-bar i{display:block;height:100%;width:100%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.cl-word{font-size:clamp(44px,14vw,76px);font-weight:900;letter-spacing:.06em;line-height:1.1;min-height:1.2em;color:#fff}
.cl-opts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:min(100%,400px)}
.cl-b{--c:var(--accent);grid-column:span 2;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 2px;font:inherit;font-weight:800;font-size:15px;letter-spacing:.06em;color:var(--c);background:rgba(5,2,10,.55);border:2px solid var(--c);border-radius:10px;cursor:pointer;text-shadow:0 0 8px var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 40%,transparent);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cl-b:nth-child(n+4){grid-column:span 3}
.cl-b b{font-size:12px;color:var(--dim);text-shadow:none}
.cl-b:hover{background:color-mix(in srgb,var(--c) 14%,rgba(5,2,10,.55))}
.cl-b:active{transform:scale(.96)}
.ff{width:min(100%,396px);aspect-ratio:1;height:auto;border-radius:10px;border:2px solid var(--accent);display:block;touch-action:manipulation;cursor:pointer}
.ff-pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:min(100%,396px)}
.ff-pad .btn{display:flex;flex-direction:column;align-items:center;gap:0;padding:7px 0;font-size:14px;line-height:1.25;letter-spacing:0;color:#07020f;background-color:var(--c);text-shadow:none}
.ff-pad .btn:hover{background-color:var(--c);filter:brightness(1.18)}
.ff-pad .btn span{font-size:16px}
.tr-row{display:flex;gap:10px;justify-content:center}
.tr-slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.tr-slot small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tr-card{width:clamp(92px,27vw,120px);aspect-ratio:2/3;display:grid;place-items:center;padding:6px;overflow:hidden;border-radius:10px;border:2px solid var(--yellow);background:linear-gradient(160deg,#2a0c4a,#0d0420);box-shadow:0 0 14px rgba(255,211,25,.35),inset 0 0 18px rgba(0,0,0,.6)}
.tr-card.back{border-color:var(--pink);background:repeating-linear-gradient(45deg,rgba(255,43,214,.28) 0 6px,transparent 6px 12px),#150636;box-shadow:0 0 14px rgba(255,43,214,.3),inset 0 0 18px rgba(0,0,0,.6)}
.tr-in{display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:100%;height:100%;text-align:center}
.tr-card.rev .tr-in{transform:rotate(180deg)}
.tr-in b{font-size:13px;letter-spacing:.12em;color:var(--yellow)}
.tr-g{font-size:40px;line-height:1;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.tr-in em{font-style:normal;font-size:13px;line-height:1.1;font-weight:700;color:#fff}
.tr-read{display:flex;flex-direction:column;gap:8px;max-width:46ch;text-align:left}
.tr-read p{margin:0}
.tr-read b{color:var(--yellow)}
.mr-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:min(100%,360px);padding:10px;border:2px solid var(--accent);border-radius:12px;background:rgba(0,0,0,.35)}
.mr-grid span{display:grid;place-items:center;aspect-ratio:1;border-radius:6px;font-weight:700;font-size:clamp(13px,3.8vw,17px);font-variant-numeric:tabular-nums;color:var(--cyan);background:rgba(34,228,255,.08)}
.mr-out{font-size:clamp(64px,22vw,120px);font-weight:900;line-height:1;color:#fff;text-shadow:0 0 18px var(--accent)}
.mr-out:empty{display:none}
.sd{width:min(100%,360px);aspect-ratio:3/4;height:auto;border-radius:10px;border:2px solid var(--accent);display:block;touch-action:none;cursor:crosshair;image-rendering:pixelated;background:#0a0414}
.sd-tools{max-width:420px}
.pw{width:min(100%,520px);aspect-ratio:4/3;height:auto;border-radius:12px;border:2px solid var(--accent);display:block;background:#07020f}
.calm .grid,.calm .screen::after,.calm .blink,.calm .caret,.calm .bob,.calm .logo .lt,.calm .logo .ghost{animation:none!important}
.calm .logo .ghost{opacity:.6}
.calm .flip-in,.calm .half,.calm .slip,.calm .mob{transition-duration:.01s!important}
.calm #jump[open],.calm #cash[open]{animation:none}
.calm .cash-hs,.calm .cash-win{animation:none}
.calm #fuzz{display:none}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="sun"><i></i></div><div class="floor"><div class="grid"></div></div></div>
<canvas id="fuzz" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>

<main class="cab">
  <header class="marquee">
    <h1 class="logo" id="logo"></h1>
    <button class="btn snd go" id="random">Random</button>
    <button class="btn snd menu-btn" id="menu" aria-haspopup="dialog">Menu</button>
    <button class="btn snd" id="snd" aria-pressed="false">Sound off</button>
    <button class="btn snd fx" id="fx" aria-pressed="true" aria-label="Motion and static effects" title="Motion and static effects">FX on</button>
  </header>
  <section class="screen">
    <div class="hud"><span id="hud-n">STAGE 00</span><button class="tix" id="hud-t" type="button" aria-haspopup="dialog"><i class="tk" aria-hidden="true"></i><b id="hud-tn">0</b></button><span class="cat" id="hud-c">READY</span></div>
    <div id="stage"></div>
    <noscript><p class="sub">This arcade needs JavaScript switched on.</p></noscript>
  </section>
</main>
<dialog id="jump" aria-labelledby="jump-h"><div class="jump-in"><div class="jump-head"><h2 id="jump-h">All cabinets</h2><div class="row"><button class="btn sm cash-b" id="jump-cash" aria-haspopup="dialog">Cash out</button><button class="btn sm" id="jump-x">Close</button></div></div><p class="sub">Every cabinet has its own link, so you can bookmark or share one.</p><div id="jump-list"></div></div></dialog>
<dialog id="cash" aria-labelledby="cash-h"><div class="cash-in" id="cash-in"></div></dialog>
<footer class="foot">&copy; 2026 Shane McElhinney. Everything runs in your browser. High scores stay on this device.<button class="btn sm" id="install" type="button" hidden>Install as an app</button></footer>

<script>
'use strict';
(() => {
/* =====================================================================
   Core helpers
   ===================================================================== */
const $ = (q, r = document) => r.querySelector(q);
const NS = 'http://www.w3.org/2000/svg';
const TAU = Math.PI * 2;
const UIFONT = 'Bahnschrift, "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", sans-serif';
const OSRM = matchMedia('(prefers-reduced-motion: reduce)');
let calm = document.documentElement.classList.contains('calm');   // set by the script in the head
const RM = { get matches() { return calm; } };                      // everything below asks RM.matches, so the FX switch reaches it all
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* Element builder. Text always goes through textContent, never innerHTML. */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c);
  return el;
}
function s(tag, attrs) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  return el;
}

/* Deck: random order, no repeats until every entry has been used. */
function makeDeck(arr) {
  let d = [], last;
  return () => {
    if (!d.length) {
      d = shuffle(arr.slice());
      if (d.length > 1 && d[d.length - 1] === last) [d[0], d[d.length - 1]] = [d[d.length - 1], d[0]];
    }
    return (last = d.pop());
  };
}

const POP = [{ transform: 'scale(.6)', opacity: 0 }, { transform: 'scale(1.12)', opacity: 1, offset: .6 }, { transform: 'scale(1)', opacity: 1 }];
const SHAKE = [{ transform: 'translateX(0)' }, { transform: 'translateX(-9px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(3px)' }, { transform: 'translateX(0)' }];
const NOANIM = { finished: Promise.resolve(), cancel() {} };
function fx(el, frames, ms = 320, opt = {}) {
  if (!el.animate) return NOANIM;
  return el.animate(frames, { duration: RM.matches ? Math.min(ms, 120) : ms, easing: 'cubic-bezier(.2,.8,.2,1)', ...opt });
}
const say = (el, text) => { el.textContent = text; fx(el, POP, 360); };
/* Keyboard shortcuts stand down while you type in a field or hold Ctrl, Cmd or Alt for a browser shortcut. */
const DIRKEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
const dirKey = e => DIRKEYS[e.key?.length === 1 ? e.key.toLowerCase() : e.key];   // arrows or WASD, either case
const keyFree = e => !(e.ctrlKey || e.metaKey || e.altKey || e.target.closest?.('input,textarea,select,dialog'));
function stats(box, pairs) {
  box.replaceChildren(...pairs.map(([k, v]) => h('span', null, h('small', { text: k }), h('b', { text: String(v) }))));
}
function floatTxt(host, text, color) {
  const f = h('span', { class: 'float', text });
  f.style.color = color; f.style.textShadow = '0 0 8px ' + color;
  host.append(f);
  fx(f, [{ opacity: 1, transform: 'translate(-50%,0)' }, { opacity: 0, transform: 'translate(-50%,-28px)' }], 600, { easing: 'ease-out' })
    .finished.then(() => f.remove(), () => f.remove());
}

/* High scores: numbers only, namespaced, failures ignored (private mode etc). */
const PFX = 'gltch-arcade:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(PFX + k); if (v === null) return d; const n = Number(v); return Number.isFinite(n) ? n : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, String(v)); } catch { /* storage unavailable */ } }
};
/* Tickets: the arcade pays out for wins, scores and time spent playing, and the prize counter takes the lot in one go.
   Only games and brain cabinets pay for wins and scores, and each kind pays at most once every 1.2 s, so a run of quick
   answers cannot print a mountain of tickets. A new best on a cabinet is worth a bonus once per visit to the page. */
const Tix = {
  n: store.get('tickets', 0), cat: '', seen: new Set(), at: {}, onadd: null,
  get live() { return this.cat === 'game' || this.cat === 'brain'; },
  add(n) {
    n = Math.round(n); if (!(n > 0)) return;
    this.n += n; store.set('tickets', this.n); store.set('tickets-life', store.get('tickets-life', 0) + n);
    if (this.onadd) this.onadd(n);
  },
  take() { const n = this.n; this.n = 0; store.set('tickets', 0); if (this.onadd) this.onadd(0); return n; },
  pay(kind, n) {
    const t = performance.now();
    if (!this.live || t - (this.at[kind] ?? -1e9) < 1200) return;
    this.at[kind] = t; this.add(n);
  },
  win() { this.pay('win', 3); },
  scored(k, v, low, rec) {
    if (!this.live || !Number.isFinite(v) || (!low && v <= 0)) return;
    this.pay('score', low ? 2 : Math.min(10, Math.ceil(Math.sqrt(v))));
    if (rec && !this.seen.has(k)) { this.seen.add(k); this.add(10); }
  }
};
function best(k, v, low = false) {
  const c = store.get(k, null), rec = c === null || (low ? v < c : v > c);
  if (rec) store.set(k, v);
  Tix.scored(k, v, low, rec);
  return rec;
}

/* =====================================================================
   Sound: synthesised in the browser, no audio files. Off until switched on.
   ===================================================================== */
const Sound = {
  on: false, ac: null, out: null,
  init() {
    if (this.ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    this.ac = new AC(); this.out = this.ac.createGain(); this.out.gain.value = .5; this.out.connect(this.ac.destination);
    return true;
  },
  tone(f = 440, d = .1, type = 'square', v = .1, slide = 0, delay = 0) {
    if (!this.on || !this.ac) return;
    const a = this.ac, t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + d + .03);
  },
  noise(d = .08, v = .15, hp = 900) {
    if (!this.on || !this.ac) return;
    const a = this.ac, len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = v;
    src.connect(f).connect(g).connect(this.out); src.start();
  },
  blip() { this.tone(880, .06, 'square', .08); },
  tick() { this.tone(1400 + Math.random() * 200, .025, 'square', .035); },
  select() { this.tone(520, .09, 'square', .08, 260); },
  coin() { this.tone(988, .07, 'square', .09); this.tone(1319, .22, 'square', .09, 0, .07); },
  win() { Tix.win(); [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .14, 'square', .08, 0, i * .08)); },
  fanfare(n = 4) { for (let i = 0; i < n; i++) { this.tone(523 * 2 ** ([0, 4, 7, 12, 16, 19, 24][i % 7] / 12), .16, 'square', .08, 0, i * .09); } this.tone(1047, .5, 'square', .06, 0, n * .09); },
  lose() { this.tone(330, .45, 'sawtooth', .07, -250); },
  pop() { this.noise(.05, .22, 1500); this.tone(700 + Math.random() * 500, .05, 'sine', .07, -300); },
  whoosh() { this.noise(.16, .05, 2500); this.tone(180, .2, 'triangle', .04, 520); }
};

/* =====================================================================
   Item lifecycle. Every item gets a ctx; anything that outlives the DOM
   (timers, frame loops, window listeners) must go through it so it is
   torn down when you move on to another cabinet.
   ===================================================================== */
function makeCtx() {
  const ac = new AbortController(), tm = new Set(), rf = new Set();
  let alive = true;
  const c = {
    get alive() { return alive; },
    on(t, ev, fn, o) { t.addEventListener(ev, fn, { ...(o || {}), signal: ac.signal }); },
    timeout(fn, ms) { const id = setTimeout(() => { tm.delete(id); if (alive) fn(); }, ms); tm.add(id); return id; },
    interval(fn, ms) { const id = setInterval(() => { if (alive) fn(); }, ms); tm.add(id); return id; },
    clear(id) { clearTimeout(id); clearInterval(id); tm.delete(id); },
    wait(ms) { return new Promise(r => c.timeout(r, ms)); },
    loop(fn) {
      let last = null, id;
      const step = t => {
        rf.delete(id); if (!alive) return;
        const dt = last === null ? 16 : Math.min(50, t - last); last = t;
        if (fn(dt, t) !== false) { id = requestAnimationFrame(step); rf.add(id); }
      };
      id = requestAnimationFrame(step); rf.add(id);
    },
    destroy() {
      alive = false; ac.abort();
      tm.forEach(id => { clearTimeout(id); clearInterval(id); }); tm.clear();
      rf.forEach(cancelAnimationFrame); rf.clear();
    }
  };
  return c;
}

const ITEMS = [];
const item = (cat, title, blurb, mount) => ITEMS.push({ cat, title, blurb, mount });
const secret = (title, blurb, mount) => ITEMS.push({ cat: 'secret', title, blurb, mount });   // not in the menu, not in Random, no link

/* Pixel sprites (original designs), drawn as one SVG path each. */
const SPR = {
  rock: ['..........', '...####...', '..######..', '.####.###.', '.###.####.', '##########', '##########', '##########', '.########.', '..........'],
  paper: ['.######...', '.#....##..', '.#....#.#.', '.#....####', '.#.####..#', '.#.......#', '.#.#####.#', '.#.......#', '.#.#####.#', '.#########'],
  scissors: ['.#......#.', '.##....##.', '..##..##..', '...####...', '....##....', '...####...', '.###..###.', '#..#..#..#', '#..#..#..#', '.##....##.'],
  lizard: ['....##....', '...####...', '....##....', '#..####..#', '.########.', '...####...', '.########.', '#..####..#', '....##....', '.....#....'],
  spock: ['.##.##....', '.##.##....', '.##.##....', '.##.##..#.', '.######.#.', '.########.', '.#######..', '.######...', '..#####...', '..#####...'],
  bug: ['..#.....#..', '...#...#...', '....###....', '#..#####..#', '.####.####.', '#####.#####', '.####.####.', '#.###.###.#', '..###.###..', '...##.##...'],
  star: ['.....#.....', '.....#.....', '....###....', '....###....', '###########', '.#########.', '..#######..', '..#######..', '.####.####.', '.###...###.', '##.......##'],
  bomb: ['.......#.#.', '........#..', '.......#...', '......#....', '...#####...', '..#######..', '.##.######.', '.#.#######.', '.#########.', '..#######..', '...#####...']
};
const sprCache = {};
function sprite(name) {
  const rows = SPR[name], w = rows[0].length, ht = rows.length;
  if (!sprCache[name]) {
    let d = '';
    rows.forEach((r, y) => { for (let x = 0; x < w; x++) if (r[x] === '#') d += `M${x} ${y}h1v1h-1z`; });
    sprCache[name] = d;
  }
  const svg = s('svg', { viewBox: `0 0 ${w} ${ht}`, class: 'sprite', 'aria-hidden': 'true', 'shape-rendering': 'crispEdges' });
  svg.append(s('path', { d: sprCache[name], fill: 'currentColor' }));
  return svg;
}

/* =====================================================================
   ORACLES
   ===================================================================== */
const OCT_SVG = '<defs><radialGradient id="octg" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#3b1670"/><stop offset="1" stop-color="#0a0414"/></radialGradient></defs>'
  + '<polygon points="135.2,15 185,64.8 185,135.2 135.2,185 64.8,185 15,135.2 15,64.8 64.8,15" fill="url(#octg)" stroke="#ffd319" stroke-width="4" stroke-linejoin="round"/>'
  + '<polygon points="128.3,31.6 168.4,71.7 168.4,128.3 128.3,168.4 71.7,168.4 31.6,128.3 31.6,71.7 71.7,31.6" fill="none" stroke="#ff2bd6" stroke-width="1.5" stroke-dasharray="5 6"/>'
  + '<g fill="#22e4ff"><circle cx="135.2" cy="15" r="3"/><circle cx="185" cy="64.8" r="3"/><circle cx="185" cy="135.2" r="3"/><circle cx="135.2" cy="185" r="3"/><circle cx="64.8" cy="185" r="3"/><circle cx="15" cy="135.2" r="3"/><circle cx="15" cy="64.8" r="3"/><circle cx="64.8" cy="15" r="3"/></g>';

item('oracle', 'Octagon Oracle', 'Ask a yes or no question, then tap the octagon. It has never been wrong. Allegedly.', (el, ctx) => {
  const next = makeDeck(['Totally.', 'Radical yes.', 'As if.', 'Gag me. No.', 'Rewind and ask again.', 'The arcade says yes.', 'Signal lost. Retune.', 'Bet your mixtape on it.', 'Not in this timeline.', 'Forecast: neon.', 'Doubtful, dude.', 'Insert another coin.', 'The pixels say maybe.', 'Absolutely tubular.', 'No way, José.', 'Ask your cat.', 'Certified yes.', 'That’s a hard nope.', 'High score yes.', 'Game over for that idea.', 'Loading... yes.', 'Error 404: answer not found.', 'Only on a Tuesday.', 'Like, totally maybe.', 'Press start on it.', 'The stars are buffering.', 'Big yes energy.', 'Hard pass, champ.', 'Gnarly. Yes.', 'Ask again after a snack.']);
  const q = h('input', { class: 'field', type: 'text', maxlength: 80, placeholder: 'Will today be excellent?', 'aria-label': 'Your question', autocomplete: 'off' });
  const svg = s('svg', { viewBox: '0 0 200 200', 'aria-hidden': 'true' });
  svg.innerHTML = OCT_SVG; // static markup, no user data
  const ans = h('span', { class: 'oct-a', text: 'Ask me' });
  const btn = h('button', { class: 'oct', 'aria-label': 'Consult the oracle' }, svg, ans);
  const note = h('p', { class: 'sub', 'aria-live': 'polite' });
  let spinning = false;
  btn.addEventListener('click', async () => {
    if (spinning) return; spinning = true;
    Sound.tone(220, .9, 'triangle', .06, 440);
    ans.style.opacity = '0';
    try {
      await fx(svg, [{ transform: 'rotate(0deg) scale(1)' }, { transform: 'rotate(250deg) scale(.8)', offset: .45 }, { transform: 'rotate(720deg) scale(1.06)', offset: .85 }, { transform: 'rotate(720deg) scale(1)' }], 1150, { easing: 'cubic-bezier(.3,.1,.2,1)' }).finished;
    } catch { /* interrupted */ }
    if (!ctx.alive) return;
    ans.textContent = next(); ans.style.opacity = '';
    fx(ans, [{ opacity: 0, filter: 'blur(8px)', letterSpacing: '.4em' }, { opacity: 1, filter: 'blur(0)', letterSpacing: '.05em' }], 600);
    const asked = q.value.trim();
    note.textContent = asked ? 'You asked: ' + asked : 'No question? Bold move.';
    Sound.coin(); spinning = false;
  });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  el.append(q, btn, note);
});

item('oracle', 'Coin Flip', 'Heads or tails? Tap the coin to toss it and see how long a streak you can ride.', (el, ctx) => {
  let rot = 0, nh = 0, nt = 0, streak = 0, last = null, busy = false;
  const coin = h('div', { class: 'coin' }, h('div', { class: 'face front', text: 'H' }), h('div', { class: 'face back', text: 'T' }));
  const shadow = h('div', { class: 'coin-shadow' });
  const area = h('div', { class: 'coin-stage', role: 'button', tabindex: 0, 'aria-label': 'Flip the coin' }, coin, shadow);
  const msg = h('div', { class: 'msg', text: 'Tap to flip' });
  const st = h('div', { class: 'stats' });
  const upd = () => stats(st, [['Heads', nh], ['Tails', nt], ['Streak', streak], ['Best streak', store.get('coin-best', 0)]]);
  async function flip() {
    if (busy) return; busy = true;
    const r = Math.random() < .5 ? 'H' : 'T';
    const target = Math.ceil((rot + 1) / 360) * 360 + 1800 + (r === 'T' ? 180 : 0);
    const D = RM.matches ? 350 : 1150;
    msg.textContent = ''; Sound.tone(260, .5, 'triangle', .05, 700);
    coin.style.transform = `rotateY(${target}deg)`;
    const a = coin.animate([
      { transform: `translateY(0) rotateY(${rot}deg) scale(1)` },
      { transform: `translateY(-130px) rotateY(${(rot + target) / 2}deg) scale(1.12)`, offset: .5 },
      { transform: `translateY(0) rotateY(${target}deg) scale(1)` }
    ], { duration: D, easing: 'cubic-bezier(.35,.05,.45,1)' });
    shadow.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.45)', opacity: .3, offset: .5 }, { transform: 'scale(1)', opacity: 1 }], { duration: D });
    try { await a.finished; } catch { /* interrupted */ }
    if (!ctx.alive) return;
    rot = target;
    if (r === 'H') nh++; else nt++;
    streak = r === last ? streak + 1 : 1; last = r;
    const record = best('coin-best', streak) && streak > 1;
    say(msg, (r === 'H' ? 'Heads' : 'Tails') + (streak > 1 ? ' x' + streak : ''));
    Sound.coin(); if (record) Sound.win();
    upd(); busy = false;
  }
  area.addEventListener('click', flip);
  area.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  upd(); el.append(area, msg, st);
});

item('oracle', 'Dice Tower', 'Pick a die and roll it. Natural 20s get the full fanfare.', (el, ctx) => {
  const SH = {
    4: ['polygon(50% 4%, 97% 93%, 3% 93%)', '20%'], 6: ['inset(6% round 16%)', '0'], 8: ['polygon(50% 1%, 99% 50%, 50% 99%, 1% 50%)', '0'],
    10: ['polygon(50% 1%, 97% 40%, 50% 99%, 3% 40%)', '-4%'], 12: ['polygon(50% 2%, 98% 37%, 80% 96%, 20% 96%, 2% 37%)', '6%'], 20: ['polygon(25% 4%, 75% 4%, 99% 50%, 75% 96%, 25% 96%, 1% 50%)', '0']
  };
  let sides = 20, busy = false;
  const hist = [];
  const num = h('b', { text: '20' });
  const die = h('div', { class: 'die' }, num);
  const msg = h('div', { class: 'msg', 'aria-live': 'polite' });
